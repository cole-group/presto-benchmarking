# Snakemake workflow configuration

# Random seed for reproducibility
random_seed: 0

# SMILES of molecules to exclude from specific datasets when downloading.
# Keyed by QCArchive dataset name (must match the name passed to get-qca-torsion-input).
exclude_smiles:
  "OpenFF-benchmark-ligand-fragments-v2.0":
    # Has a weird H bonded directly to S (breaks ELF-10; no atom type for this H)
    - "[H:9][c:8]1[c:6]([c:5]([c:47]([c:45]([c:10]1[N:11]([H:44])[c:12]2[n:38][c:37]3[c:36]([c:14]([n:13]2)[O:15][C:16]([H:34])([H:35])[C:17]4([C:19]([C:22]([C:25]([C:28]([C:31]4([H:32])[H:33])([H:29])[H:30])([H:26])[H:27])([H:23])[H:24])([H:20])[H:21])[H:18])[N:43]=[C:41]([N:39]3[H:40])[H:42])[H:46])[H:48])[S:2](=[O:3])(=[O:4])[H:1])[H:7]"

# Optional QCArchive record ID inclusion filter for downloaded datasets.
# Keyed by QCArchive dataset name (must match the name passed to get-qca-torsion-input).
include_qcarchive_ids:
  "OpenFF Lipid Torsion Drives v4.0":
    # - 146649921
    - 146649941

# TNet500 dataset splitting
tnet500_frac_test: 0.8  # 20% validation, 80% test

# Protein force field configurations for benchmarking
protein_force_fields:
  #  "AceFF_2.0":
  #    ff_path: "dummy_ff.xml"
  #    ff_type: "aceff20"
  "Sage_230":
    ff_path: "input_ff/openff_unconstrained-2.3.0.offxml"
    ff_type: "smirnoff-nagl"
  "Rosemary_Alpha_0":
    ff_path: "input_ff/openff_no_water_unconstrained-3.0.0-alpha0.offxml"
    ff_type: "smirnoff-nagl"
  ff14SB:
    ff_path: "input_ff/ff14SB.xml"
    ff_type: "amber"
  ff19SB:
    ff_path: "input_ff/protein.ff19SB.xml"
    ff_type: "amber"
  espaloma:
    ff_path: "dummy_ff.xml"
    ff_type: "espaloma"

# yammbs torsion scan analysis configuration
yammbs_analysis:
  # Default base force fields passed to yammbs
  base_force_fields:
    - "openff-2.3.0"

  # Per-target extra force fields
  targets:
    tnet500:
      test:
        extra_force_fields:
          - "input_ff/esp04.offxml"
          - "input_ff/aceff20.offxml"
          # - "garnet"
      validation:
        # For validation, all ablation variants are included in analyse_tnet500_validation_ablations rule
        extra_force_fields: []
        # Force fields included on every torsion scan plot (by short key / label)
        torsion_plot_base_force_fields:
          - "default"
          - "openff-2.3.0"
        # Per-torsion extra force fields to add on top of the base set
        torsion_plot_ids:
          140:
            - "no_metad"
          412:
            - "no_min"
          477:
            - "one_it"
          493: []
    jacs_fragments:
      test:
        extra_force_fields:
          - "input_ff/bespokefit1_sage_jacs_frags.offxml"
          - "input_ff/esp04.offxml"
            #- "input_ff/de-force_unconstrained-1.0.3.offxml"
          # - "garnet"
          - "input_ff/aceff20.offxml"
    phosphate_torsion_drives:
      test:
        extra_force_fields: []
    jacs_fragments_full_mol_fits:
      test:
        extra_force_fields:
          - "input_ff/bespokefit1_sage_jacs_frags.offxml"
          - "input_ff/esp04.offxml"
          # - "input_ff/aceff20.offxml"

# Folmsbee conformer benchmark analysis configuration
folmsbee_analysis:
  reference_method: "dlpno"
  exclude_smarts:
    - "[#15]"
    - "[SX4](=[OX1])(=[OX1])[NX3]"
    - "[SX4](=[OX1])(=[OX1])[NX2]"
  min_conformers_per_molecule: 5
  min_reference_energy_window: 0.0
  precomputed_methods:
    - "mp2"
    - "wb97"
    - "ani2"
  mlp_names: ["aimnet2"]
  single_point_mlp: true
  torsion_restraint_force_constant: 100000
  mm_minimization_steps: 0
  n_processes: null
  targets:
    test:
      extra_force_fields:
        - "input_ff/openff_unconstrained-2.3.0.offxml"
        - "input_ff/esp04.offxml"
    orb_subset:
      extra_force_fields:
        - "input_ff/openff_unconstrained-2.3.0.offxml"
        - "input_ff/esp04.offxml"
        - "benchmarking/folmsbee_conformers/output/test/aimnet2/combined_force_field.offxml"
      min_reference_energy_window: 3.0
      subset_max_molecules: 100
      subset_selection_strategy: "random"
      subset_seed: 0
    phosphate_sulphonamide:
      # Mirror of the "test" set but restricted to the molecules screened out
      # by the global folmsbee_analysis.exclude_smarts filters (phosphates and
      # sulphonamides). include_smarts overrides the global exclude_smarts so
      # only matching molecules survive, and exclude_smarts is cleared.
      extra_force_fields:
        - "input_ff/openff_unconstrained-2.3.0.offxml"
        - "input_ff/esp04.offxml"
      include_smarts:
        - "[#15]"
        - "[SX4](=[OX1])(=[OX1])[NX3]"
        - "[SX4](=[OX1])(=[OX1])[NX2]"
      exclude_smarts: []
      min_reference_energy_window: 0.0
      # Effectively unlimited — keep every matching molecule
      subset_max_molecules: 100000
      subset_selection_strategy: "name"
      subset_seed: 0

# TYK2 congeneric series benchmark configuration
tyk2_congeneric_series:
  smiles:
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C([H])([H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C(C([H])([H])[H])(C([H])([H])[H])C([H])([H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)[C@]1(C([C@]1(Cl)[H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C1([H])C(C(C(C1([H])[H])([H])[H])([H])[H])([H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C1(C(C(C1([H])[H])([H])[H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)[C@]1(C([C@]1(F)[H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C([H])(C([H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)N(C([H])([H])C([H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)[C@]1(C([C@]1(C#N)[H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C([H])([H])O[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C1(C(C1([H])[H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)OC([H])([H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C(C([H])([H])[H])(C([H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)[C@]1(C([C@]1(C([H])([H])[H])[H])([H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)c1c(c(c(c(c1[H])[H])[H])[H])[H])[H])[H])[H])[H])Cl)[H])[H]"
    - "c1(c(c(c(c(c1[H])Cl)C(=O)N(c1c(c(nc(c1[H])N(C(=O)C([H])([H])C1([H])C(C1([H])[H])([H])[H])[H])[H])[H])[H])Cl)[H])[H]"
  config_name: "one_it_aimnet2_no_msm"
  retrain_max_extend_distances: [0, 1, 2, 3]

# TYK2 cyclopropyl edges torsion scan analysis
tyk2_cyclopropyl_edges_torsions:
  qca_dataset: "OpenFF-benchmark-ligand-fragments-v2.0"
  qcarchive_ids:
    - 80030539  # jmc_23
    - 80032714  # ejm_46
    - 80030532  # jmc_28
    - 80032744  # ejm_55
  force_fields:
    - "benchmarking/rbfe_sandbox/presto_ffs/tyk2/bespoke_ff.offxml"
    - "input_ff/openff_unconstrained-1.3.1.offxml"
  reference_fragments:
    ejm_31: "CC(=O)Nc1ccccn1"

# 1mer protein joint-fit benchmark configuration
protein_1mer_joint_fit:
  config_names:
    - "orb_max_extend_1"


# presto vs OpenFF BespokeFit 0.4.4 speed comparison (not part of `rule all`; see README)
speed_comparison:
  smiles: "CCC(CC)C(=O)Nc2cc(NC(=O)c1c(Cl)cccc1Cl)ccn2"  # TYK2 ligand
  presto_config: "aimnet2_openff221"  # same start as bespokefit (2.3.0 needs toolkit >=0.17)
  # Timed repeats per method. presto and the AIMNet2 bespokefit variants also get a
  # warm-up run_00 (excluded from statistics).
  repeats:
    presto: 5
    presto_uninstrumented: 2  # checks the timing instrumentation's overhead
    bespokefit_aimnet2_matched: 3
    bespokefit_aimnet2_stock: 3
    bespokefit_qm: 1  # ~1 h per torsion drive for a small fragment
  aimnet2_parity:
    n_conformers: 20
    n_calls_per_conformer: 5


# Fit robustness: repeat fits x torsion regularisation strength, with timings.
# Each molecule is scored against its own QM data: QCArchive torsion drives
# ("torsion"), Folmsbee DLPNO conformer energies ("folmsbee"), or none.
fit_robustness:
  dir: "benchmarking/fit_robustness"
  pixi_environment: "default-save-ff-trajectory" # So we can watch the evolution of parameters during the fit.
  configs:
    reg0: "configs/aimnet2_reg0.yaml"    # no torsion regularisation
    reg1: "configs/aimnet2.yaml"         # default (k: 1.0)
    reg10: "configs/aimnet2_reg10.yaml"  # 10x
  repeats: {reg0: 5, reg1: 10, reg10: 5}
  warmup_molecule: "folmsbee_flex"  # largest molecule: first fit measures the worst-case time
  molecules:
    tyk2:  # neutral TYK2 ligand of the original reproducibility study; no QM data
      qm: "none"
      smiles: "CCC(CC)C(=O)Nc2cc(NC(=O)c1c(Cl)cccc1Cl)ccn2"
    # Anionic model glycerophospholipid: dipropanoyl glycerol-3-phosphate methyl ester
    # (S enantiomer, as in the QCA record). Of the set's charged molecules it has the most
    # torsion drives of any molecule.
    lipid:
      qm: "torsion"
      smiles: "[C@H](COC(=O)CC)(COP(=O)([O-])OC)OC(=O)CC"
      qca_dataset: "OpenFF Lipid Torsion Drives v4.0"
      qcarchive_ids: [146649972, 146649973, 146649974, 146649975, 146649976, 146649977,
                      146649978, 146649979, 146649980, 146649981, 146649982]
    folmsbee_flex:  # neutral, many rotatable bonds without being too large (for speed)
      qm: "folmsbee"
      smiles: "c1n(cnc1C(=O)N)[C@@H](CO)CCn1ccc2c1cc(cc2)NC(=O)CCc1ccccc1"
      folmsbee_id: "astex_1uml"
    # JACS fragments v2 (B3LYP-D3BJ/DZVP torsion drives): per formal charge, the
    # molecule with >= 2 torsion drives with ~ average presto RMSE for the charge class.
    anion:
      qm: "torsion"
      smiles: "COC(=O)Nc1cccc(-c2sc(C(=O)[O-])cc2Br)c1"
      qca_dataset: "OpenFF-benchmark-ligand-fragments-v2.0"
      qcarchive_ids: [80031016, 80030467]
    cation:
      qm: "torsion"
      smiles: "CNC(=O)[C@H]1CCCN1C(=O)[C@H]([NH3+])Cc1ccccc1"
      qca_dataset: "OpenFF-benchmark-ligand-fragments-v2.0"
      qcarchive_ids: [80031744, 80031742, 80031743]
    neutral_fragment:  # a TYK2 cyclopropanecarboxamide fragment
      qm: "torsion"
      smiles: "O=C(Nc1ccccn1)[C@H]1C[C@@H]1Cl"
      qca_dataset: "OpenFF-benchmark-ligand-fragments-v2.0"
      qcarchive_ids: [80032941, 80032956, 80032949]
